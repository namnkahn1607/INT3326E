steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - asia-southeast1-docker.pkg.dev/int3326e/web-repo/web-image:$_TAG
      - --build-arg
      - VITE_API_URL=$_VITE_API_URL
      - --build-arg
      - VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY
      - --build-arg
      - VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN
      - --build-arg
      - VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID
      - --build-arg
      - VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID
      - --build-arg
      - VITE_CARTO_API_KEY=$_VITE_CARTO_API_KEY
      - --build-arg
      - VITE_VIETMAP_API_KEY=$_VITE_VIETMAP_API_KEY
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/int3326e/web-repo/web-image:$_TAG
images:
  - asia-southeast1-docker.pkg.dev/int3326e/web-repo/web-image:$_TAG
substitutions:
  _VITE_API_URL: ''
  _VITE_FIREBASE_API_KEY: ''
  _VITE_FIREBASE_AUTH_DOMAIN: int3326e.firebaseapp.com
  _VITE_FIREBASE_PROJECT_ID: int3326e
  _VITE_FIREBASE_APP_ID: ''
  _VITE_CARTO_API_KEY: ''
  _VITE_VIETMAP_API_KEY: ''
