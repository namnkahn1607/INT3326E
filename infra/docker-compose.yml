version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: parcelflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcelflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelflow}
      POSTGRES_DB: ${POSTGRES_DB:-parcelflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcelflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: parcelflow-pubsub
    restart: unless-stopped
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=${PUBSUB_PROJECT_ID:-parcelflow-dev}
    ports:
      - "8085:8085"

volumes:
  postgres_data:
